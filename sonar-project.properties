sonar.projectKey=sistema-gestion-olivos
sonar.sourceEncoding=UTF-8
sonar.sources=app,components,lib
sonar.tests=tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts
sonar.test.exclusions=tests/mocks/**,tests/features/**,tests/e2e/**
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/reports/**,**/.scannerwork/**
sonar.coverage.exclusions=tests/**,scripts/**,types/**,**/*.d.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=reports/sonar-report.xml